modules:
  - type: dnf
    repos:
      files:
        - https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo
        # - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://pkgs.tailscale.com/stable/fedora/39/tailscale.repo
      copr:
        - alternateved/keyd
    install:
      packages:
        - bees
        # - brave-browser
        - default-editor
        - duperemove
        - et
        - fdupes
        - fish
        # - git-filter-repo
        - gcc-c++
        - gnome-boxes
        - gnome-shell-extension-gsconnect
        - gnome-tweaks
        - image-builder
        - jdupes
        - keyd
        - libvirt-devel
        - nautilus-gsconnect
        - pipx
        - quickemu
        - rEFInd
        - sbsigntools
        # - starship
        - tailscale
        # - terra-release
        - vagrant
        - vim-default-editor
    remove:
      packages:
        - nano-default-editor

  - type: systemd
    system:
      enabled:
        - tailscaled.service

  - type: files
    files:
      - source: bitwarden-polkit
        destination: /

  - type: script
    snippets:
      - |
        chmod 0644 /usr/share/polkit-1/actions/com.bitwarden.Bitwarden.policy
        chown root:root /usr/share/polkit-1/actions/com.bitwarden.Bitwarden.policy
