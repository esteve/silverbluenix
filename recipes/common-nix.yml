modules:
  - type: files
    files:
      - source: nix
        destination: /

  - type: dnf
    install:
      packages:
        - nix

  - type: script
    snippets:
      - "rm -rf /nix"
      - "mkdir -p /nix"

  - type: systemd
    system:
      enabled:
        - nix.mount
        - nix-daemon.service
